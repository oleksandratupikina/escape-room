<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Escape Room 13</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <section id="start-screen" class="page active">
            <h1 class="header">Room 13</h1>
            <p class="subheader">You have 15 minutes</p>
            <p class="instruction">Find the exit</p>
            <button id="btn-start" class="btn btn-primary">Enter</button>
        </section>
        <section id="game-screen" class="page">
            <header class="top-bar">
                <span class="logo">🔐 ESCAPE: ROOM 13</span>
                <div id="locks" class="locks">🔒 🔒 🔒 🔒 🔒</div>
            </header>
            <p class="intro">You wake up in a dark room. <em>Five locks stand between you and freedom.</em></p>
            <section class="room-grid">This is main content.</section>
            <footer>
                <p class="message">Explore the room. Click objects to investigate.</p>
            </footer>
        </section>
        <script src="script.js"></script>
    </body>
</html>
